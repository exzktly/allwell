# Project tooling configuration for All-Well.
#
# This file pins the ruff configuration that CI enforces (see
# .github/workflows/ci.yml). The rule set is deliberately curated: it
# enforces genuine correctness signals (pyflakes, syntax errors,
# whitespace) while ignoring stylistic families that the codebase has
# never enforced and whose mass-fix would create enormous, risky churn
# (line length, multiple-statements, naming). Those can be tightened
# incrementally later.
#
# Blind-except (BLE001) is intentionally NOT enforced here: ruff cannot
# distinguish a *logged* broad catch from a *silently swallowed* one. The
# silent-swallow anti-pattern is instead caught by a targeted guardrail
# test (tests/test_no_silent_except.py), added alongside the `swallow`
# helper in core/safe.py.

# ── pytest ───────────────────────────────────────────────────────────────────
# Lives here rather than in tests/pytest.ini so BOTH invocations load the same
# config. With the ini under tests/, `pytest tests/` found it (rootdir=tests/)
# while CI's bare `python -m pytest` did not (rootdir=repo root) — so markers
# went unregistered and filterwarnings/testpaths were inert in CI only. A config
# file at the root is discovered from either.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = [
    "qt: test constructs Qt objects; needs the offscreen platform",
    "slow: heavy test (e.g. real StarDist model load + inference); deselect with -m \"not slow\"",
    "wells: the dataset a fixture builds — {well_token: path}; unmarked tests get a default plate",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
# ``source = ["."]`` rather than a package list: the question this measurement
# exists to answer is which application modules NO test reaches, and a module
# nothing imports is absent from the report unless coverage is told to look for
# it on disk.
source = ["."]
# Paths stored relative to this file's directory, not absolute. Coverage
# defaults to absolute, which is invisible until the day two machines' data are
# combined -- and the slow lane is hours of work, so it is the obvious thing to
# run elsewhere. A remote checkout at a different path produces a data file
# whose every entry is a *different file* from the local one; ``coverage
# combine`` then succeeds, reports roughly twice as many modules as the repo
# has, and the zero-coverage inventory it feeds is wrong in the direction that
# invents dead code. Relative paths make a data file portable between any two
# checkouts of the same tree.
relative_files = true
# Both lanes run as many short processes — the slow lane by design (one or two
# files each, because a full-app test's Qt objects are never reclaimed in
# process), the fast lane whenever it is sharded. Parallel mode writes one data
# file per process for ``coverage combine`` to merge; without it each process
# overwrites the last and the report describes whichever finished last.
parallel = true
# Line coverage only. The question is "does any test execute this at all"; branch
# coverage costs runtime on a lane that is already the gate for every push, and
# answers a finer question than the one being asked.
branch = false
omit = [
    "tests/*",
    "scripts/*",
    "_Docs/*",
    "*/site-packages/*",
    "*/.venv/*",
    # Widget demo blocks: every widgets/*.py ends in a __main__ that opens a
    # window, which no test runs and none should.
    "*/__main__.py",
    # PySide6 injects these module names into the running process under the
    # current working directory. They have no source on disk, so measuring them
    # aborts the report with "No source for code".
    "shibokensupport/*",
    "signature_bootstrap.py",
]

[tool.coverage.report]
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
# Generated / vendored / non-source trees.
extend-exclude = [
    # Not source: the installer, the requirements lists, the live Markdown docs,
    # the visual-audit screenshots and the HTML design mockups all live here.
    "_Docs",
]

[tool.ruff.lint]
# Curated, high-signal rule set the tree already satisfies (after the
# trivial whitespace auto-fixes applied when this config was introduced).
select = [
    "E4",   # import formatting (multiple imports on one line)
    "E7",   # statement-level correctness (a few)
    "E9",   # syntax errors / IO errors — must always be zero
    "F",    # pyflakes — the real-bug family (undefined names, bad fstrings, ...)
    "W",    # whitespace hygiene
]
ignore = [
    # --- Intentional structural patterns -----------------------------------
    "E402",  # module-import-not-at-top: pipeline/Qt modules must set env vars
             # (KERAS_HOME, QT_QPA_PLATFORM) *before* importing TF / Qt.
    "E501",  # line-too-long: never historically enforced; 1200+ sites.
    "E701",  # multiple-statements-on-one-line (colon): pervasive, stylistic.
    "E702",  # multiple-statements-on-one-line (semicolon): pervasive.
    "E731",  # lambda-assignment: a couple of local one-liners, stylistic.
    "E741",  # ambiguous variable name (l/I/O): a handful, stylistic.

    # --- Pyflakes subcodes that are noise in THIS codebase ------------------
    # F401 (unused-import) is now ENFORCED (audit G5): the 56 genuinely-unused
    # imports were dropped, and the intentional side-effect / re-export imports
    # (availability probes, `__init__` re-exports) carry an explicit
    # `# noqa: F401` with a reason. Keep new unused imports out of the tree.
    "F811",  # redefinition-while-unused: harmless local re-imports inside
             # functions that also import at module scope.
]
# F821 (undefined-name) is ENFORCED. It was ignored for quoted
# forward-reference annotations whose names are imported lazily in workers
# ("StarDist2D | None"); every such site in this tree now declares the name
# under `if TYPE_CHECKING:`, which costs nothing at runtime and satisfies the
# rule, so the tree has zero hits. A new site that cannot do that takes a
# targeted `# noqa: F821` rather than turning the rule back off — leaving it off
# was the blind spot CLAUDE.md 7.5 #11 records: deleting an `app = ctx.window`
# bridge left `app` unbound in three functions and lint stayed green.
# `tests/test_guards_bite.py` proves the rule fires on an unbound name and
# clears the TYPE_CHECKING spelling.

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins and use loose patterns.
"tests/*" = ["F841"]
