name: CI

# Runs ruff (lint) + a bounded "fast lane" pytest job on every PR and push to main.
#
# The pytest job runs `-m "not slow"`: full-app Qt tests (the `viewer_app` /
# `loaded_app` fixtures) are auto-marked `slow` by tests/conftest.py because they
# are slow under the offscreen QPA platform (and a true C-level hang can't be
# interrupted by pytest's signal timeout). The fast lane (~11,230 tests here;
# the GUI layout tests in tests/_lanes.py are left out with --no-ui and run only
# locally) is the guardrails + pure-logic + per-feature tests — the
# refactor-safety net. The three gated lanes in tests/_lanes.py (nanowell
# end-to-end ~320 tests, nanowell features ~1,020, remote / HPC ~800) run in
# the jobs below, in parallel with it, and only when scripts/lane_needed.py says
# the pull request can reach them. Those numbers are worth keeping honest:
# they read "~1,770 tests, ~60s" for long enough that the lane grew more than
# fourfold underneath them, and this comment is what a reader consults to decide
# whether the 15-minute job cap below still has headroom. Re-measure with
# `scripts/test.sh --no-ui --collect-only -q | tail -1`, which
# takes about ten seconds. The heavy full-app integration tests + the real-StarDist e2e + the
# playground worker run in the local/manual full pass (`pytest` with no marker
# filter, or `-m slow`). A job-level timeout-minutes is the backstop if a `slow`
# tag is ever missed.
#
# The pytest command itself lives in scripts/test.sh so a developer running the
# fast lane locally runs byte-identical flags; this job only adds --junitxml.
# scripts/test.sh runs the lane under pytest-xdist (`-n auto --dist loadfile`),
# one worker per runner CPU; the JUnit report is written by the controller from
# every worker's results, which is what the gate below reads.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff==0.15.8"
      - name: ruff check
        run: ruff check .

  # Every pull request bumps version.py exactly once (CLAUDE.md §6), measured against the base as it stands now:
  # see scripts/version_bump_ci.sh for why the author's own preflight check is not enough.
  version:
    name: version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: One increment against the base
        run: scripts/version_bump_ci.sh

  test:
    name: pytest (fast lane)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PySide6 needs system GL/EGL libraries even under the offscreen QPA.
      - name: Install Qt system libraries
        run: |
          # `apt-get update` exits non-zero when *any* configured repository's
          # index fails to fetch, including the third-party ones the runner
          # image ships and this project does not use. A stale google-chrome
          # index ("Hash Sum mismatch" on dl.google.com) has failed this step
          # outright, before a line of Python ran. That is not a reason to stop:
          # the install below is the real gate, and a package that genuinely
          # cannot be fetched still fails it, loudly and by name.
          sudo apt-get update || echo "::warning::apt-get update reported errors \
            — if the install below cannot locate a package, the fetch above is why"
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt
      # --no-ui: the GUI layout / appearance tests (tests/_lanes.py) run in the
      # local fast lane only, not here. The gated rosters run in the jobs below.
      - name: Run fast lane
        env:
          QT_QPA_PLATFORM: offscreen
        # Gated on the JUnit report, not the exit code: see scripts/junit_gate.py
        # (a PySide6 teardown SIGSEGV after a green run is tolerated).
        run: |
          scripts/test.sh --no-ui --junitxml=.pytest-report.xml || true
          python scripts/junit_gate.py .pytest-report.xml

  nanowell:
    # The nanowell end-to-end files (tests/_lanes.py NANOWELL_E2E_FILES): rendered
    # tiles through the real lattice and site detection, about 1,075 s of work. In
    # the fast lane they took it from ~2.5 to ~9.5 min locally and to ~12 of its
    # 15-minute cap in CI, so they run here, beside it, distributed by test.
    #
    # Gated, like the job below: on a pull request scripts/lane_needed.py decides
    # whether the change can reach a nanowell test (a nanowell, pipeline/ or
    # process_microscopy.py path, or a module a nanowell test imports directly),
    # and the job passes without running the lane when it cannot. A push to main
    # always runs it: the gate reads direct imports only, and the merge is where a
    # change two imports away gets caught.
    name: pytest (nanowell lane)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Can this change reach the lane?
        id: gate
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "push to ${{ github.ref_name }}: always run"
          elif python scripts/lane_needed.py nanowell --base "origin/${{ github.base_ref }}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Qt system libraries
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update || echo "::warning::apt-get update reported errors"
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt
      - name: Run nanowell lane
        if: steps.gate.outputs.run == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          scripts/test.sh --nanowell --junitxml=.pytest-report.xml || true
          python scripts/junit_gate.py .pytest-report.xml

  gated:
    # The two other gated rosters (tests/_lanes.py): the nanowell feature tests
    # (form, page, playground search, Review's nanowell data; ~530 s of work) and
    # the remote / HPC tests (~100 s). Each runs only when scripts/lane_needed.py
    # says the pull request can reach it, and both always run on a push to main.
    # Out of the fast-lane job, they run beside it rather than after it.
    name: pytest (nanowell features + remote)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Can this change reach the nanowell tests?
        id: nanowell
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "push to ${{ github.ref_name }}: always run"
          elif python scripts/lane_needed.py nanowell --base "origin/${{ github.base_ref }}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Can this change reach the remote tests?
        id: remote
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "push to ${{ github.ref_name }}: always run"
          elif python scripts/lane_needed.py remote --base "origin/${{ github.base_ref }}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Qt system libraries
        if: steps.nanowell.outputs.run == 'true' || steps.remote.outputs.run == 'true'
        run: |
          sudo apt-get update || echo "::warning::apt-get update reported errors"
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install Python dependencies
        if: steps.nanowell.outputs.run == 'true' || steps.remote.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt
      - name: Run nanowell feature lane
        if: steps.nanowell.outputs.run == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          scripts/test.sh --nanowell-features --junitxml=.pytest-nanowell.xml || true
          python scripts/junit_gate.py .pytest-nanowell.xml
      - name: Run remote lane
        if: steps.remote.outputs.run == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          scripts/test.sh --remote --junitxml=.pytest-remote.xml || true
          python scripts/junit_gate.py .pytest-remote.xml
