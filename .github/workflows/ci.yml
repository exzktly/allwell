name: CI

# Runs ruff (lint) and the pytest suite on every PR and on pushes to main.
#
# The scientific ML stack (TensorFlow / Torch / StarDist / Cellpose) is NOT
# installed here: it is large, slow, and pinned to Python 3.10, and — verified
# empirically — no test in tests/ requires it (the segmentation/pipeline tests
# mock or degrade gracefully when it is absent). CI therefore installs only the
# lightweight scientific + Qt stack, which keeps runs fast while still
# exercising the full test suite.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff==0.15.8"
      - name: ruff check
        run: ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PySide6 needs system GL/EGL libraries even under the offscreen QPA.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        # Per-test timeout guards against a single test hanging the runner.
        run: |
          python -m pytest tests/ -q \
            --timeout=180 --timeout-method=signal
