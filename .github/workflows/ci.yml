name: CI

# Runs ruff (lint) + a bounded "fast lane" pytest job on every PR and push to main.
#
# The pytest job runs `-m "not slow"`: full-app Qt tests (the `viewer_app` /
# `loaded_app` fixtures) are auto-marked `slow` by tests/conftest.py because they
# are slow under the offscreen QPA platform (and a true C-level hang can't be
# interrupted by pytest's signal timeout). The fast lane (~800 tests, ~40s) is
# the guardrails + pure-logic + per-feature/widget tests — the refactor-safety
# net. The heavy full-app integration tests + the real-StarDist e2e + the
# playground worker run in the local/manual full pass (`pytest` with no marker
# filter, or `-m slow`). A job-level timeout-minutes is the backstop if a `slow`
# tag is ever missed.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff==0.15.8"
      - name: ruff check
        run: ruff check .

  test:
    name: pytest (fast lane)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PySide6 needs system GL/EGL libraries even under the offscreen QPA.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt
      - name: Run fast lane
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # PySide6 (offscreen QPA) can raise SIGSEGV in its Qt teardown at
          # interpreter exit — *after* every test has passed — which exits the
          # process with code 139 and would fail this step despite a green run.
          # Gate on the JUnit report instead of the raw process exit code: a real
          # test failure/error, or a mid-run crash that leaves no (or a partial)
          # report, still fails the job; only the post-success teardown segfault
          # is tolerated. pytest writes the report at session end, before the
          # atexit teardown that segfaults, so a clean run always produces it.
          python -m pytest -m "not slow" -q \
            --timeout=90 --timeout-method=signal \
            --junitxml=.pytest-report.xml || true
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path(".pytest-report.xml")
          if not report.exists():
              print("No pytest report written — pytest crashed before finishing.")
              sys.exit(1)
          root = ET.parse(report).getroot()
          suites = root.findall("testsuite") or (
              [root] if root.tag == "testsuite" else []
          )
          tests = sum(int(s.get("tests", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          print(f"pytest report: tests={tests} failures={failures} errors={errors}")
          sys.exit(1 if (tests == 0 or failures or errors) else 0)
          PY
