name: Slow lane

# The full-app Qt tests, which the fast lane deselects and therefore no gate has
# ever run. That gap is not theoretical: a test asserting a solo well's spread
# was "0" sat red on main for as long as the producer had correctly returned NaN
# for a single replicate, and every green CI run went straight over it.
#
# Why this cannot be one pytest process. Each full-app test builds a real
# WellViewerApp of ~1,800 QObjects whose Qt-to-Python reference web is never
# reclaimed in-process, so RSS climbs ~40 MB per test, monotonically. Across ~395
# tests that is ~15 GB and an OOM kill. So the work is split two ways: a matrix
# of shards for wall-clock, and **one pytest process per test file** inside each
# shard for memory. No file here holds more than 26 tests, which is the budget
# CLAUDE.md section 2 gives for a single invocation.
#
# Opt-in rather than automatic: put the `slow-lane` label on a pull request. A
# full pass is roughly 100 minutes of runner time, which is not worth spending on
# every push, and the fast lane remains the gate.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: slow-lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow:
    # `labeled` fires for every label; the condition is what limits this to the
    # one we mean, and it also re-checks on synchronize so a labelled PR keeps
    # running the lane as it is pushed to.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'slow-lane')
    name: "slow lane (shard ${{ matrix.shard }}/6)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt
      - name: Run this shard, one process per file
        env:
          QT_QPA_PLATFORM: offscreen
          SHARD: ${{ matrix.shard }}
          SHARDS: "6"
        run: |
          set -uo pipefail
          mkdir -p .slow-reports

          # Derive the file list from pytest itself rather than checking a list
          # into the repo: a hand-maintained roster goes stale silently, and a
          # file that stops being collected would then be reported as passing.
          python - <<'PY' > .slow-files.txt
          import re, subprocess, sys
          out = subprocess.run(
              [sys.executable, "-m", "pytest", "tests", "-m", "slow",
               "--collect-only", "-q"],
              capture_output=True, text=True).stdout
          files = sorted({m for m in re.findall(r"<Module ([\w.]+\.py)>", out)})
          if not files:
              sys.exit("collected no slow test files — refusing to report a pass")
          print("\n".join(files))
          PY

          total=$(wc -l < .slow-files.txt)
          echo "slow-lane files: $total (shard $SHARD of $SHARDS)"

          # (NR-1) because awk's NR is 1-based and the report check below
          # enumerates from 0. Mismatched, each shard would run one set of
          # files and then gate on another set's reports.
          mine=$(awk -v s="$SHARD" -v n="$SHARDS" '(NR-1) % n == s' .slow-files.txt)
          if [ -z "$mine" ]; then
            echo "This shard has no files."; exit 0
          fi

          for f in $mine; do
            path=$(find tests -name "$f" | head -1)
            [ -n "$path" ] || { echo "MISSING: $f"; exit 1; }
            echo "::group::$path"
            # PySide6's offscreen QPA can SIGSEGV in Qt teardown at interpreter
            # exit, after every test has passed. `|| true` keeps that from
            # failing the step; the reports are the gate, exactly as the fast
            # lane does it. A crash that kills pytest before it writes its report
            # still fails, because the file will be missing.
            python -m pytest "$path" -m "" \
              --junitxml=".slow-reports/${f%.py}.xml" || true
            echo "::endgroup::"
          done

          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          expected = [f for f in Path(".slow-files.txt").read_text().split()]
          import os
          shard, shards = int(os.environ["SHARD"]), int(os.environ["SHARDS"])
          mine = [f for i, f in enumerate(expected) if i % shards == shard]
          tests = failures = errors = 0
          missing = []
          for f in mine:
              report = Path(".slow-reports") / f"{f[:-3]}.xml"
              if not report.exists():
                  missing.append(f)
                  continue
              root = ET.parse(report).getroot()
              suites = root.findall("testsuite") or (
                  [root] if root.tag == "testsuite" else [])
              tests += sum(int(s.get("tests", 0)) for s in suites)
              failures += sum(int(s.get("failures", 0)) for s in suites)
              errors += sum(int(s.get("errors", 0)) for s in suites)
          print(f"shard {shard}: files={len(mine)} tests={tests} "
                f"failures={failures} errors={errors}")
          if missing:
              print("No report written for: " + ", ".join(missing))
          # tests == 0 fails too: a shard that ran nothing has measured nothing,
          # and reporting that as a pass is the failure mode this lane exists to
          # close.
          sys.exit(1 if (missing or failures or errors or tests == 0) else 0)
          PY
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-lane-reports-shard-${{ matrix.shard }}
          path: .slow-reports/
          if-no-files-found: warn
