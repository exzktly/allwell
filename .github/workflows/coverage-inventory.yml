name: Coverage inventory

# Which application modules does NO test reach — computed where the data is.
#
# The question needs BOTH lanes in one measurement. The fast lane alone reports
# every full-app-only module as unreached, and acting on that list would delete
# live code: eleven modules came back "zero executed lines" from a fast-lane-only
# run and every one of them had a live application importer, most of them behind
# a lazily-built tab that only a `viewer_app` test constructs.
#
# So this workflow is the second half of a two-step measurement:
#
#   1. Dispatch **Slow lane** with the `coverage` box ticked. Each shard uploads
#      its per-batch data as `slow-lane-coverage-shard-<n>`.
#   2. Dispatch **this**, with that run's id. It runs the fast lane under
#      coverage here, pulls the six shard artifacts, combines the lot, and prints
#      the inventory into the job log.
#
# **Why the finding is printed rather than the data downloaded.** Artifact
# downloads redirect to Azure blob storage, which an egress policy can refuse
# while leaving the GitHub API itself reachable. A measurement whose result can
# only be read by someone able to fetch a blob is a measurement that does not
# travel. The job log travels, so the log is where the answer goes; the combined
# data file is uploaded as well, for anyone who *can* fetch it.
#
# Two steps rather than one job appended to the slow lane, because the slow lane
# is six shards of up to 75 minutes: an inventory that could only be produced by
# re-running all of it would cost hours for a list this workflow can rebuild from
# artifacts already paid for.
#
# **Two triggers, because not every caller can use the first one.** A dispatch
# takes the run id as an input, which is what a person clicking Run workflow
# wants. An assistant session cannot do that: its GitHub token carries
# `actions: read` and not `actions: write`, so the dispatch API answers 403 and
# the measurement would be stuck waiting for someone to click. So the run id can
# also be written into `.github/coverage-inventory-run-id`, and a push touching
# that one path starts the workflow — a trigger anything able to push the branch
# can pull. The path filter is what keeps ordinary commits from starting it.
on:
  workflow_dispatch:
    inputs:
      slow_run_id:
        description: "Run id of a Slow lane run dispatched with coverage ticked"
        required: true
        type: string
  push:
    branches-ignore:
      # Not on the default branch. Merging a pull request that touched the
      # run-id file is a push to `main` touching it, which would start a
      # 40-minute inventory nobody asked for against a run id that is by then
      # stale. The file is a working note on a branch, not a `main` artifact.
      - main
    paths:
      - ".github/coverage-inventory-run-id"

# Successive pushes to that path would otherwise stack overlapping 12-minute
# fast lanes, the way ci.yml and slow-lane.yml already refuse to.
concurrency:
  group: coverage-inventory-${{ github.ref }}
  cancel-in-progress: true

# Reading another run's artifacts is an Actions API call, not a contents one.
permissions:
  contents: read
  actions: read

jobs:
  inventory:
    name: zero-coverage inventory (both lanes)
    runs-on: ubuntu-latest
    # The fast lane is ~12 minutes under coverage; the rest is download and
    # combine. 40 leaves room for a slow runner without cutting off a lane that
    # is merely having a bad day.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the slow-lane run id
        id: runid
        env:
          # Through the environment rather than interpolated into the script
          # body: the `case` below runs *after* an expansion, so it cannot
          # protect one. Dispatch already needs write access, so this is
          # hardening rather than a hole — but ARCHITECTURE claims the value is
          # validated before use, and this is what makes that true of both
          # routes rather than only of the file one.
          SLOW_RUN_ID: ${{ inputs.slow_run_id }}
        run: |
          set -uo pipefail
          id="$SLOW_RUN_ID"
          if [ -z "$id" ] && [ -f .github/coverage-inventory-run-id ]; then
            id="$(head -1 .github/coverage-inventory-run-id | tr -d '[:space:]')"
          fi
          # Validated rather than trusted: this value is interpolated into an
          # artifact lookup, and a file that has picked up a stray word should
          # fail here saying so rather than fail later looking like a run with no
          # artifacts in it — which is the diagnosis this workflow refuses on.
          case "$id" in
            "" ) echo "::error::No slow-lane run id. Dispatch with slow_run_id, or"
                 echo "::error::write the id into .github/coverage-inventory-run-id."
                 exit 1 ;;
            *[!0-9]* ) echo "::error::Run id '$id' is not a number."; exit 1 ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "slow-lane run id: $id"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PySide6 needs system GL/EGL libraries even under the offscreen QPA.
      - name: Install Qt system libraries
        run: |
          # `apt-get update` exits non-zero when *any* configured repository's
          # index fails to fetch, including the third-party ones the runner
          # image ships and this project does not use. A stale google-chrome
          # index ("Hash Sum mismatch" on dl.google.com) has failed this step
          # outright, before a line of Python ran. That is not a reason to stop:
          # the install below is the real gate, and a package that genuinely
          # cannot be fetched still fails it, loudly and by name.
          sudo apt-get update || echo "::warning::apt-get update reported errors \
            — if the install below cannot locate a package, the fetch above is why"
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt
      # The fast lane runs FIRST, and into a data file of its own. pytest-cov
      # combines at the end of its session by consuming the data files that
      # share its COVERAGE_FILE prefix, and writes the result under that name —
      # so a lane run with the shards already on disk is one rename away from
      # eating them. Ordering it first means it cannot, whatever the prefix.
      #
      # `|| true` because the fast lane exits 139 on a PySide6 teardown SIGSEGV
      # after a green run (see scripts/test.sh). This job is a measurement and
      # not a gate — ci.yml is the gate, and it reads the JUnit report rather
      # than the exit code for exactly this reason.
      - name: Fast lane under coverage
        env:
          QT_QPA_PLATFORM: offscreen
          COVERAGE_FILE: .coverage.fastlane
        run: ALLWELL_COVERAGE=1 scripts/test.sh || true
      - name: Check the fast lane actually measured something
        run: |
          if [ ! -s .coverage.fastlane ]; then
            echo "::error::The fast lane wrote no coverage data. Combining"
            echo "::error::without it would report every fast-lane-only module"
            echo "::error::as unreached, which is the error this whole workflow"
            echo "::error::exists to avoid making."
            exit 1
          fi
          ls -l .coverage.fastlane
      - name: Check the slow run is one this answer can be built from
        # The refusal downstream is keyed on "any shard data at all", which is
        # not the same question as "is this data valid for this tree". Three
        # ways a plausible-but-wrong list gets printed, so three checks:
        #
        #   * a run at a different commit — its slow lane measured a different
        #     tree, so any module added since that only a full-app test reaches
        #     reads as unreached;
        #   * a run that did not succeed — a shard that died early still
        #     uploads `if: always()`, so partial data passes a "> 0" test;
        #   * fewer than the six shards the matrix declares, for any reason.
        #
        # Each produces false positives in the same direction: naming live code
        # dead. That is the one error worth failing the job over.
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.runid.outputs.id }}
        run: |
          set -euo pipefail
          api="repos/${{ github.repository }}/actions/runs/${RUN_ID}"
          run_json=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                          -H "Accept: application/vnd.github+json" \
                          "https://api.github.com/${api}")
          head_sha=$(echo "$run_json" | python -c "import json,sys;print(json.load(sys.stdin).get('head_sha',''))")
          conclusion=$(echo "$run_json" | python -c "import json,sys;print(json.load(sys.stdin).get('conclusion',''))")
          echo "slow run ${RUN_ID}: head_sha=${head_sha} conclusion=${conclusion}"

          if [ "$head_sha" != "${{ github.sha }}" ]; then
            echo "::error::Slow run ${RUN_ID} measured ${head_sha}, but this"
            echo "::error::checkout is ${{ github.sha }}. A module added since"
            echo "::error::that only a full-app test reaches would read as"
            echo "::error::unreached. Re-run Slow lane on this commit."
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::Slow run ${RUN_ID} concluded '${conclusion}'. A shard"
            echo "::error::that died early still uploads its partial data, so"
            echo "::error::the inventory would be short without saying so."
            exit 1
          fi
          artifacts=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                           -H "Accept: application/vnd.github+json" \
                           "https://api.github.com/${api}/artifacts?per_page=100" \
            | python -c "import json,sys;print(sum(1 for a in json.load(sys.stdin).get('artifacts',[]) if a['name'].startswith('slow-lane-coverage-shard-') and not a['expired']))")
          echo "shard coverage artifacts present: ${artifacts}/6"
          if [ "$artifacts" -ne 6 ]; then
            echo "::error::Expected 6 shard coverage artifacts, found ${artifacts}."
            echo "::error::Either a shard produced none or they have expired."
            exit 1
          fi
      - name: Collect the shards' coverage
        uses: actions/download-artifact@v4
        with:
          pattern: slow-lane-coverage-shard-*
          merge-multiple: true
          run-id: ${{ steps.runid.outputs.id }}
          github-token: ${{ github.token }}
      - name: Combine, and report the inventory
        run: |
          # `set +e`, not `set -uo pipefail` alone. GitHub runs a step body as
          # `bash -e {0}`, and `set -uo pipefail` does not clear that `-e`: with
          # no matches `ls` exits 2, `pipefail` carries it through `wc`, and the
          # assignment below trips errexit. The job did fail — safe direction —
          # but it died *before* the four error lines that say what to do, and
          # the real `ls` error had gone to /dev/null, so the only thing on
          # screen was "(none)". A refusal that refuses without saying why is
          # the shortfall this workflow exists to make visible, in the one
          # branch it was written around.
          set +e
          set -uo pipefail
          echo "slow-lane data files collected:"
          ls -1 .coverage.slow-* 2>/dev/null || echo "  (none)"
          shards=$(ls -1 .coverage.slow-* 2>/dev/null | wc -l)

          # Refused rather than printed on partial data. This list's only use is
          # deciding which modules no test reaches, and missing slow-lane data
          # produces false positives in exactly that direction — it names live
          # code dead, which is the one error worth refusing to make.
          if [ "$shards" -eq 0 ]; then
            echo "::error::No slow-lane coverage in run ${{ steps.runid.outputs.id }}."
            echo "::error::Dispatch Slow lane with the coverage box ticked, then"
            echo "::error::re-run this with that run's id. The fast lane alone"
            echo "::error::names full-app-only modules unreached; that list must"
            echo "::error::not be read."
            exit 1
          fi
          echo "combining ${shards} slow-lane batch file(s) with the fast lane"

          echo "::group::Combined coverage summary"
          scripts/coverage.sh
          echo "::endgroup::"

          echo "## Modules no test reaches" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # `coverage.sh` combines on its first call and leaves `.coverage`
          # behind, so this second call reads the already-combined file.
          scripts/coverage.sh --zero | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: .coverage
          include-hidden-files: true
          if-no-files-found: warn
