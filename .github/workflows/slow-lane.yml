name: Slow lane

# The full-app Qt tests that `ci.yml` deliberately skips.
#
# ci.yml runs `scripts/test.sh`, which is `-m "not slow"`. Everything using the
# `viewer_app` fixture is auto-marked `slow` by tests/conftest.py, so ~270 tests
# across 82 files have had no automated coverage at all — a permanently-failing
# test can sit in there indefinitely without anyone noticing, which is exactly
# what happened to tests/test_qc_reopen_apply.py.
#
# It is not part of the PR gate because it takes minutes rather than seconds and
# its per-test memory profile (see scripts/test_slow.sh) makes it fragile under
# parallel load.
#
# **On demand only.** It used to also run nightly, on a 04:00 UTC cron. That was
# six shards of up to 75 minutes every day whether or not anything had changed,
# which is real money for a signal nobody was reading on most mornings — the
# repository had gone quiet for days at a time while the matrix kept billing. It
# is dispatched by hand instead, from the Actions tab, and `scripts/test_slow.sh`
# runs the same lane locally.
#
# The cost of that trade is the thing the lane was added to prevent: a
# permanently-failing full-app test can now sit unnoticed again, as
# `tests/test_qc_reopen_apply.py` once did. So run it deliberately — before
# merging anything that reshapes a feature package, and after any change to the
# app's construction or teardown.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Test files per pytest process (1 is safest, 2 is the default)"
        required: false
        default: "2"
      coverage:
        description: "Measure coverage and upload the data (slower; for the zero-coverage inventory)"
        required: false
        type: boolean
        default: false

concurrency:
  group: slow-lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow:
    name: pytest (slow lane) ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    # A shard runs ~14 of the 82 files, and app construction dominates: the
    # heaviest single batch measured ~12 minutes on its own. 75 leaves a shard
    # that draws two expensive batches room to finish rather than being cut off
    # mid-run, which would report as a failure.
    timeout-minutes: 75
    strategy:
      # One shard's failure should not cancel the others — we want the full
      # picture from a dispatched run, not the first casualty.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # PySide6 needs system GL/EGL libraries even under the offscreen QPA.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-dev.txt
      - name: Run slow lane shard
        env:
          QT_QPA_PLATFORM: offscreen
          # Opt-in, so an ordinary "is the lane green" dispatch is not slowed by
          # a measurement it does not want. Set it for the zero-coverage
          # inventory, which needs BOTH lanes in one measurement: the fast lane
          # alone reports every full-app-only module as unreached, and acting on
          # that list would delete live code.
          ALLWELL_COVERAGE: ${{ inputs.coverage && '1' || '' }}
        run: |
          scripts/test_slow.sh \
            --shard ${{ matrix.shard }}/6 \
            --batch ${{ github.event.inputs.batch || '2' }}
      - name: Upload coverage data
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: slow-lane-coverage-shard-${{ matrix.shard }}
          # One file per shard, combined against the fast lane's locally.
          # ``relative_files`` is on in pyproject, so a runner's checkout path
          # does not make these a different set of files from anyone else's.
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-lane-reports-shard-${{ matrix.shard }}
          path: .pytest-slow-reports/
          # The report directory is dot-prefixed, so every path under it counts
          # as hidden and upload-artifact@v4 skips it by default — the run then
          # logs "No files were found" and uploads nothing, which is exactly the
          # diagnostic material you need when the run comes back red.
          include-hidden-files: true
          # A shard that produced no report at all is a real signal (the batch
          # crashed before writing one), so warn rather than fail the step —
          # scripts/test_slow.sh has already failed the run for that.
          if-no-files-found: warn
