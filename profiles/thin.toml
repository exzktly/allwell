# The "thin" build: only Plotting, Sample Definitions, and the Segmentation +
# Image Table image-review tabs. Run the FULL tree as thin with:
# ALLWELL_PROFILE=thin and produce a physically-stripped tree with
# scripts/derive_profile.py.
name = "thin"
features = ["Plotting", "Sample Definitions", "Image Browser"]

# Narrows the Image Browser to just these sub-tabs (a parent omitted here keeps
# all of its sub-tabs). Read by the runtime filter AND the offline generator.
[subtabs]
"Image Browser" = ["Segmentation", "Image Table"]
